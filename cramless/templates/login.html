<!DOCTYPE html>
<head>  
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>


<body>

    <div class="top-row">
        <a href="/language/en" style="color: white;">EN</a>  <a href="/language/fr" style="color: white;">FR</a>
    </div>

    <div class="login-wrapper">

        <div class="login-card">

            <h1>{{t.login}}</h1>

            <form id="loginform" method="POST" action="/login">

                <div class="form-row">
                    <label for="email">{{t.email}}: </label>
                    <input type="email" id="email" name="email" required />
                </div>
                
                <div class="form-row">
                    <label for="password">{{t.password}}: </label>
                    <input type="password" id="password" name="password" required />
                </div>                
        
                <button type="submit">{{t.login}}</button>
            </form>
        
            <p class="signup-link">
                {{t.newUser}}?
                <a href="/register"> {{t.signUp}} </a>
            </p>
        </div>
  </div>
</body>


<style>

    .top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: rgb(41, 126, 244);
        padding: 1rem 2rem;
        width: 100%;
        box-sizing: border-box;
    }

    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: rgb(180, 232, 255);
    }

    .login-card {
        background-color: #fff;
        padding: 2rem;
        align-items: center;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(112, 101, 101, 0.1);
        width: 279px;
    }


    input[type="email"], input[type="password"] {
        margin-bottom: 1rem;
    }

    .form-row {
        margin-right: 1rem;
    }
</style>

</html>
