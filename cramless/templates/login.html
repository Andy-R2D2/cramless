{% extends "base.html" %}
{% block title %}Cramless — {{ t.login }}{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card">
        <h1 style="margin-bottom: 1.25rem; font-size: 1.5rem;">{{ t.login }}</h1>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form id="loginform" method="POST" action="/login">
            <div class="form-group">
                <label for="email">{{ t.email }}</label>
                <input type="email" id="email" name="email" class="full-width" required>
            </div>

            <div class="form-group">
                <label for="password">{{ t.password }}</label>
                <input type="password" id="password" name="password" class="full-width" required>
            </div>

            <button type="submit" class="btn full-width">{{ t.login }}</button>
        </form>

        <p style="margin-top: 1.25rem; font-size: 0.9rem; color: var(--muted); text-align: center;">
            {{ t.newUser }}?
            <a href="/register" style="color: var(--primary); font-weight: 600;">{{ t.signUp }}</a>
        </p>
    </div>
</div>
{% endblock %}
