{% extends "base.html" %}
{% block title %}Cramless — {{ t.register }}{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card">
        <h1 style="margin-bottom: 1.25rem; font-size: 1.5rem;">{{ t.register }}</h1>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/register">
            <div class="form-group">
                <label for="email">{{ t.email }}</label>
                <input type="email" id="email" name="email" class="full-width" required>
            </div>

            <div class="form-group">
                <label for="password">{{ t.password }}</label>
                <input type="password" id="password" name="password" class="full-width" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">{{ t.confirmPassword }}</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="full-width" required>
            </div>

            <!-- Policy checkbox from Raihan's branch (#16): must be ticked to register -->
            <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
                <input type="checkbox" id="agree" name="agree" required>
                <label for="agree" style="margin: 0;">
                    I agree to the <a href="/policy" target="_blank" style="color: var(--primary);">content &amp; privacy policy</a>
                </label>
            </div>

            <button type="submit" class="btn full-width">{{ t.signUp }}</button>
        </form>

        <p style="margin-top: 1.25rem; font-size: 0.9rem; color: var(--muted); text-align: center;">
            {{ t.existingUser }}?
            <a href="/login" style="color: var(--primary); font-weight: 600;">{{ t.signIn }}</a>
        </p>
    </div>
</div>
{% endblock %}
